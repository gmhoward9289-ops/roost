name: release

# Builds the three distributables for a tag and attaches them to the release.
# Nothing here publishes to PyPI: that needs a token on the account, so the
# wheel is uploaded to the release and `twine upload` stays a deliberate manual
# step. The .deb is the apt story -- there is no PPA, so it is installed with
# `sudo apt install ./roost_<version>_all.deb`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Build the .deb
        run: packaging/build-deb.sh

      # The version lives in roost.py alone. A tag that disagrees with it would
      # publish artifacts whose filenames contradict the release they hang off.
      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          code_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' roost.py)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$code_version" != "$tag_version" ]; then
            echo "tag $tag_version != __version__ $code_version" >&2
            exit 1
          fi

      # PEP 440 strips the leading zero, so __version__ "0.02" builds a wheel
      # named roost-0.2 while the tag, the .deb and the man page all say 0.02.
      # That is a chosen tradeoff, not an accident -- surfaced here rather than
      # discovered on the PyPI page after an upload that cannot be undone.
      - name: Report the PyPI-normalised version
        run: |
          code_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' roost.py)
          pypi_version=$(basename "$(ls dist/*.whl)" | cut -d- -f2)
          echo "__version__ / tag / deb / man : $code_version"
          echo "wheel, sdist and PyPI         : $pypi_version"
          if [ "$code_version" != "$pypi_version" ]; then
            echo "::warning::PyPI will publish this as $pypi_version, not $code_version"
          fi

      - name: Verify the built package actually runs
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/roost --version
          /tmp/v/bin/roost -1 --no-color
          test -f /tmp/v/share/man/man1/roost.1

      - name: Verify the .deb installs and the man page is readable
        run: |
          sudo apt-get install -y ./dist/roost_*_all.deb
          roost --version
          man -w roost

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushing a tag does not create a GitHub Release, so uploading straight
        # to one fails on a plain `git push --tags`. Create it if it is not there
        # and upload either way, so the tag is the only step a release needs.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # Publishes the tagged build to PyPI via trusted publishing (OIDC): PyPI
  # trusts this repo's release.yml through the "pypi" environment, so no API
  # token exists anywhere -- not in secrets, not on a laptop. The first run
  # needs the pending publisher registered on the PyPI account; until then
  # this job fails on its own and can be re-run after registration. The
  # release artifacts above land either way.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Drop the .deb -- PyPI takes wheels and sdists only
        run: rm -f dist/*.deb
      - uses: pypa/gh-action-pypi-publish@release/v1
