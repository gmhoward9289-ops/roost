name: release

# Builds the distributables for a tag, attaches them to the release, and
# publishes the wheel and sdist to PyPI as roost-top -- the bare name is held
# in reserve there, and the pypi job below says how the publishing works.
#
# The .deb is also pushed into a real apt repo by the apt-repo job below, so
# `sudo apt install ./roost_<version>_all.deb` (no repo, no updates) and
# `sudo apt install roost` (via the hosted repo, with updates) both work --
# see that job for how the repo itself gets built and signed.
#
# Windows gets a frozen exe (windows-exe job) and a PR against winget-pkgs
# (winget job) -- see those jobs for why onedir/zip beats onefile here and
# what the winget job's one-time setup looks like.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_apt_repo:
        description: Run the apt-repo job even without a tag (re-publish the current version for real, without touching PyPI)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Build the .deb
        run: packaging/build-deb.sh

      # The version lives in roost.py alone. A tag that disagrees with it would
      # publish artifacts whose filenames contradict the release they hang off.
      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          code_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' roost.py)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$code_version" != "$tag_version" ]; then
            echo "tag $tag_version != __version__ $code_version" >&2
            exit 1
          fi

      # The man page and the Homebrew formula embed the version as literal text
      # rather than deriving it. Both drifted on v0.3, and neither failure is
      # loud: `man roost` simply disagrees with `roost --version`, and a stale
      # formula passes its own version assertion because Homebrew reads
      # `version` from the same stale URL it fetches. ci.yml runs this on every
      # PR; repeating it here makes a tag build refuse to publish a mismatch.
      - name: Check the man page and Homebrew formula match __version__
        run: packaging/check-version-consistency.sh

      # PEP 440 would rewrite a version like "0.02" to "0.2", so the wheel
      # filename could disagree with the tag, the .deb and the man page. 0.3 is
      # already canonical and normalises to itself, but this fails loudly if the
      # version is ever changed to something PEP 440 rewrites.
      - name: Check the wheel filename matches the version
        run: |
          code_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' roost.py)
          wheel_version=$(basename "$(ls dist/*.whl)" | cut -d- -f2)
          echo "version / tag / deb / man : $code_version"
          echo "wheel and sdist           : $wheel_version"
          if [ "$code_version" != "$wheel_version" ]; then
            echo "::error::PEP 440 rewrote $code_version to $wheel_version; pick a canonical version" >&2
            exit 1
          fi

      - name: Verify the built package actually runs
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/roost --version
          /tmp/v/bin/roost -1 --no-color
          test -f /tmp/v/share/man/man1/roost.1

      - name: Verify the .deb installs and the man page is readable
        run: |
          sudo apt-get install -y ./dist/roost_*_all.deb
          roost --version
          man -w roost

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushing a tag does not create a GitHub Release, so uploading straight
        # to one fails on a plain `git push --tags`. Create it if it is not there
        # and upload either way, so the tag is the only step a release needs.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # Publishes the tagged build to PyPI via trusted publishing (OIDC): PyPI
  # trusts this repo's release.yml through the "pypi" environment, so no API
  # token exists anywhere -- not in secrets, not on a laptop. The pending
  # publisher on the PyPI account is registered for the project "roost-top";
  # if that registration ever lapses this job fails alone, and the release
  # artifacts above land either way.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Drop the .deb -- PyPI takes wheels and sdists only
        run: rm -f dist/*.deb
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Publishes the tagged build to npm as roost-top via trusted publishing
  # (OIDC), the same no-token pattern as the pypi job above: npmjs.com trusts
  # this exact repo + workflow file through a registered Trusted Publisher, so
  # `npm publish` requests a short-lived credential instead of reading a
  # stored secret. Needs npm CLI >= 11.5.1, which actions/setup-node's bundled
  # npm can lag behind -- upgraded explicitly rather than assumed.
  #
  # One-time setup this job depends on and cannot do for itself: on
  # https://www.npmjs.com/package/roost-top/access, add a Trusted Publisher ->
  # GitHub Actions, pointing at gmhoward9289-ops/roost, workflow file
  # release.yml, environment "npm" (create that GitHub Environment here too,
  # unprotected is fine -- it exists to give the pairing a name, mirroring how
  # the pypi job above uses one). Until that's registered, this job fails
  # alone; PyPI and apt still publish.
  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm publish

  # Publishes the .deb into a real, signed apt repo hosted on this repo's
  # GitHub Pages (gh-pages branch), so users get `sudo apt install roost` and
  # `apt upgrade` instead of a one-shot manual .deb download. One arch (all),
  # one suite (stable), one component (main) -- roost has no variants that
  # would need more.
  #
  # Signing key: a dedicated, sign-only key (not George's personal key),
  # imported here from the ROOST_APT_GPG_PRIVATE_KEY secret. Its public half
  # is the master copy at packaging/apt/pubkey.asc, published unchanged as
  # roost-archive-keyring.asc at the repo root so `curl | gpg --dearmor` gets
  # exactly what signed the Release file. Rotating it means: generate a new
  # key, replace the secret, replace packaging/apt/pubkey.asc, tell existing
  # users to re-import.
  #
  # Requires the gh-pages branch to already exist (bootstrapped once,
  # separately -- this job only ever updates it, never creates it) and GitHub
  # Pages to be enabled for the repo pointed at that branch.
  apt-repo:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_apt_repo
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tag (for packaging/apt/pubkey.asc)
        uses: actions/checkout@v7
        with:
          path: src

      - name: Check out gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install apt repo tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.ROOST_APT_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          fpr=$(echo "$GPG_PRIVATE_KEY" | gpg --batch --import-options show-only --import --with-colons 2>/dev/null | awk -F: '/^fpr:/{print $10; exit}')
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEYFPR=$fpr" >> "$GITHUB_ENV"

      - name: Add the new .deb to the pool
        run: |
          deb=$(ls dist/*_all.deb)
          install -D -m 0644 "$deb" "gh-pages/pool/main/r/roost/$(basename "$deb")"

      - name: Publish the signing key alongside the repo
        run: cp src/packaging/apt/pubkey.asc gh-pages/roost-archive-keyring.asc

      - name: Rebuild the package index
        working-directory: gh-pages
        run: |
          mkdir -p dists/stable/main/binary-all
          apt-ftparchive packages pool > dists/stable/main/binary-all/Packages
          gzip -9fk dists/stable/main/binary-all/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=roost \
            -o APT::FTPArchive::Release::Label=roost \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=all \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="top for Claude Code" \
            release dists/stable > dists/stable/Release

      - name: Sign the release
        working-directory: gh-pages
        run: |
          gpg --batch --yes --default-key "$KEYFPR" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --default-key "$KEYFPR" -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: Verify the signature the way apt will
        run: gpg --verify gh-pages/dists/stable/InRelease

      - name: Commit and push
        working-directory: gh-pages
        run: |
          git config user.name "roost-release-bot"
          git config user.email "dev@swamplink.com"
          git add -A
          git commit -m "Publish $GITHUB_REF_NAME" || echo "nothing changed"
          git push origin gh-pages

      - name: Discard the imported private key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"

  # Builds a Windows executable and attaches it to the release, so the winget
  # job below has something other than a bare .py script to point at. --onedir
  # rather than --onefile: onefile re-extracts to %TEMP% on every launch (bad
  # for a tool people leave running) and is the specific shape that trips AV
  # heuristics and stalls winget's moderation queue. Shipped as a zip, which
  # winget's "zip" installer type unpacks directly -- no bundled installer
  # needed for a console app with no state to migrate.
  windows-exe:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the onedir bundle
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onedir --name roost --console roost.py

      - name: Smoke test the frozen exe
        shell: bash
        run: dist/roost/roost.exe --version

      - name: Zip the bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist/roost && 7z a "../roost-${version}-windows-x64.zip" .)
          echo "ZIP=dist/roost-${version}-windows-x64.zip" >> "$GITHUB_ENV"

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber

  # Opens (or updates) the PR against microsoft/winget-pkgs for this release,
  # via the community winget-releaser action -- winget has no OIDC trusted-
  # publishing equivalent, so this is the closest analog: no long-lived token
  # on npm/PyPI's model, just a PAT scoped for exactly this one action to use.
  #
  # One-time setup this job depends on and cannot do for itself:
  #   1. Fork microsoft/winget-pkgs to this account (winget-releaser pushes a
  #      branch to the fork, then opens the PR from there against
  #      microsoft/winget-pkgs). Keeping the fork current is no longer manual:
  #      the sync step below does it on every run.
  #   2. A WINGET_PAT secret on this repo -- unlike TAP_PUSH_TOKEN, this has to
  #      be a *classic* PAT with the `public_repo` scope. Fine-grained PATs can
  #      only be scoped to repos this account owns, and microsoft/winget-pkgs
  #      is not one of them, so the classic-token/public_repo combination is
  #      the only shape that works. That scope is wide -- write access to
  #      every public repo on the account, not just the fork -- there is no
  #      narrower option available.
  #   3. The very first submission for a brand-new winget package identifier
  #      needs a human-reviewed PR merged by Microsoft's moderators before
  #      later versions auto-update smoothly. That happened on 2026-08-11:
  #      microsoft/winget-pkgs#411432 merged 0.6.1 as gmhoward9289-ops.roost,
  #      so from 0.9.0 on this job updates an existing package.
  # Until all three are in place, this job fails alone; everything else above
  # still publishes.
  winget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-exe]
    runs-on: windows-latest
    steps:
      # winget-releaser only UPDATES a package that already exists; it cannot
      # create one. Before the bootstrap PR merged it exited 1 with "Package
      # ... does not exist", turning every release red for a condition sitting
      # in someone else's review queue -- nothing here could act on it, and a
      # red nobody can act on trains you to ignore the ones you can.
      #
      # The bootstrap has since merged, so this guard now passes -- it stays
      # because the same failure returns if the package is ever removed or the
      # identifier is renamed, and a skip-with-notice is the right shape for
      # that too.
      - name: Is the package bootstrapped in winget-pkgs yet?
        id: bootstrapped
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_ID: gmhoward9289-ops.roost
        run: |
          letter=$(echo "${PKG_ID:0:1}" | tr 'A-Z' 'a-z')
          path="manifests/$letter/${PKG_ID//./\/}"
          if gh api "repos/microsoft/winget-pkgs/contents/$path" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG_ID is not in winget-pkgs yet -- skipping the winget publish. The first version of a new package needs a human-reviewed PR merged by Microsoft's moderators; see https://github.com/microsoft/winget-pkgs/pull/411432"
          fi

      # winget-releaser creates its branch on the fork from the fork's own
      # default branch, and a fork that has drifted behind upstream makes that
      # fail outright -- v0.8.1 died with "failed to create branch" because the
      # fork was two weeks stale, and the fix was this exact sync run by hand.
      # The fork only ever receives generated manifest branches, never direct
      # commits to its default branch, so a fast-forward sync always succeeds.
      # Sync failure must not block winget-releaser: a stale fork is better than
      # no publish attempt, and a missing/expired WINGET_PAT fails here with a
      # clearer message before the releaser step runs.
      - name: Require WINGET_PAT
        if: steps.bootstrapped.outputs.exists == 'true'
        shell: bash
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if [ -z "$WINGET_PAT" ]; then
            echo "::error::WINGET_PAT secret is missing. Create a classic PAT with the public_repo scope and set it with: gh secret set WINGET_PAT --repo ${{ github.repository }}"
            exit 1
          fi

      - name: Sync the winget-pkgs fork with upstream
        if: steps.bootstrapped.outputs.exists == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          gh repo sync gmhoward9289-ops/winget-pkgs --source microsoft/winget-pkgs \
            || echo "::warning::fork sync failed; continuing with winget-releaser against the fork as-is"

      # SHA-pinned, not @v2: this job holds a classic PAT with public_repo --
      # write access to every public repo on the account -- and a mutable tag
      # on a third-party action is a supply-chain path to that token.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        if: steps.bootstrapped.outputs.exists == 'true'
        with:
          identifier: gmhoward9289-ops.roost
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_PAT }}

  # Publishes packaging/roost.rb (this repo's master copy) into the tap repo
  # (gmhoward9289-ops/homebrew-tap) as Formula/roost.rb, with a freshly
  # computed sha256 for this tag's release tarball. The checksum used to be a
  # manual "refresh it after tagging" step -- see the comment this replaced at
  # the top of packaging/roost.rb -- and a manual step is exactly how the v0.2
  # tarball shipped from a formula that still read 0.2 and passed its own
  # version assertion anyway (see check-version-consistency.sh).
  #
  # One-time setup this job depends on and cannot do for itself: a
  # TAP_PUSH_TOKEN secret on this repo -- a fine-grained PAT scoped to
  # gmhoward9289-ops/homebrew-tap with Contents: Read and write. The default
  # GITHUB_TOKEN only carries permission inside this repo, not a second one.
  homebrew-tap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require TAP_PUSH_TOKEN
        shell: bash
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "::error::TAP_PUSH_TOKEN secret is missing. Create a fine-grained PAT scoped to gmhoward9289-ops/homebrew-tap with Contents read/write and set it with: gh secret set TAP_PUSH_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi

      - name: Check out this repo (for packaging/roost.rb)
        uses: actions/checkout@v7
        with:
          path: src

      - name: Mint a GitHub App token for the tap
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: gmhoward9289-ops
          repositories: |
            roost
            homebrew-tap

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: gmhoward9289-ops/homebrew-tap
          ref: master
          path: tap
          token: ${{ steps.tap-token.outputs.token }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Points at the sdist already uploaded to the GitHub Release by the
      # "Attach to the release" step above, not GitHub's auto-generated
      # archive/refs/tags/ URL -- that URL isn't a release asset at all, so
      # GitHub doesn't count `brew install` downloads in the repo's release
      # download_count the way it does for the .deb/.whl assets.
      - name: Compute the release asset checksum
        run: |
          sdist=$(ls dist/*.tar.gz)
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$sdist")"
          sha256=$(sha256sum "$sdist" | cut -d' ' -f1)
          echo "URL=$url" >> "$GITHUB_ENV"
          echo "SHA256=$sha256" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Write the formula with this release's url, checksum, and version
        run: |
          sed -e "s#^  url \".*\"#  url \"$URL\"#" \
              -e "s#^  sha256 \".*\"#  sha256 \"$SHA256\"#" \
              -e "s#^  version \".*\"#  version \"$VERSION\"#" \
              src/packaging/roost.rb > tap/Formula/roost.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "roost-release-bot"
          git config user.email "dev@swamplink.com"
          git add Formula/roost.rb
          git diff --cached --quiet && echo "nothing changed" || git commit -m "roost $GITHUB_REF_NAME"
          git push origin master

  # Rewrites the roost stanza in swamplink-root's tools/versions.json, which
  # is what https://swamplink.com/tools/roost/ displays as "latest release".
  # The catalog is a family file (roost + leghorn + legbar); this job must
  # never replace the whole object. Until the SWAMPLINK_* secrets exist on
  # this repo the job notices and exits 0 -- a missing one-time setup must
  # not redden the rest of the release, same as winget before its bootstrap
  # PR merged. xycalc keeps the same secret names on a `production`
  # environment; roost reads them as repo secrets so a missing environment
  # cannot stall the tag.
  swamplink-tools:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Patch swamplink-root tools/versions.json
        env:
          SSH_KEY: ${{ secrets.SWAMPLINK_SSH_KEY }}
          HOST: ${{ secrets.SWAMPLINK_HOST }}
          KNOWN_HOSTS: ${{ secrets.SWAMPLINK_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST:-}" ] || [ -z "${KNOWN_HOSTS:-}" ]; then
            echo "::notice::SWAMPLINK_SSH_KEY / SWAMPLINK_HOST / SWAMPLINK_KNOWN_HOSTS are not set. Live https://swamplink.com/tools/versions.json lives in swamplink-root, not this repo. Bump the roost stanza there by hand (packaging/swamplink-roost.json is the object to copy). See docs/swamplink.md."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          date=$(sed -n "s/^## \[${version}\].*(\([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\)).*/\1/p" CHANGELOG.md | head -1)
          if [ -z "$date" ]; then
            date=$(date -u +%F)
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy -o BatchMode=yes'
          git clone "${HOST}:/srv/git/swamplink-root.git" /tmp/swamplink-root
          catalog=/tmp/swamplink-root/tools/versions.json
          if [ ! -f "$catalog" ]; then
            echo "::error::$catalog not in swamplink-root -- refusing to guess the path"
            exit 1
          fi
          packaging/publish-swamplink-roost.sh --catalog "$catalog" --date "$date"
          git -C /tmp/swamplink-root config user.name "roost-release-bot"
          git -C /tmp/swamplink-root config user.email "dev@swamplink.com"
          git -C /tmp/swamplink-root add tools/versions.json
          if git -C /tmp/swamplink-root diff --cached --quiet; then
            echo "catalog already at roost $version"
            exit 0
          fi
          git -C /tmp/swamplink-root commit -m "chore(roost): tools/versions.json $GITHUB_REF_NAME"
          git -C /tmp/swamplink-root push origin HEAD:master
