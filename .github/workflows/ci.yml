name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # roost claims 3.9+ and claims to run on Windows and macOS. Both claims are
    # load-bearing -- the Windows path uses ctypes for process liveness and
    # console VT, which no Linux run would ever exercise.
    #
    # This is deliberately not a full os x python cross product (it was: 24
    # legs, 12 of them macOS). The interpreter is tested on Linux, where a leg
    # costs seconds, across every minor from the 3.9 floor to 3.14, which is
    # what the primary dev box actually runs. The other two platforms are here
    # to prove the platform claim, not to re-test each interpreter:
    #
    # - macOS gets one leg, on 3.13, because that is the python@3.13 the
    #   Homebrew formula installs -- the interpreter nearly every Mac user runs
    #   this under. There is no Intel leg: roost is pure-Python stdlib with no
    #   dependencies at all (pyproject.toml: `dependencies = []`), so arm64 vs
    #   x86_64 cannot change a result. (macos-15-intel used to be here, and
    #   macos-13 before GitHub retired that image in Dec 2025.)
    # - Windows gets the floor and the ceiling, 3.9 and 3.14, because the
    #   ctypes and console code is where an interpreter change would bite, and
    #   the two ends bracket it. No windows-curses here, so unlike leghorn
    #   nothing stops the 3.14 leg.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI
        run: |
          python roost.py --version
          python roost.py -1 --no-color

  # roost.py is the single source of the version, but the man page and the
  # Homebrew formula embed it as literal text and both drifted on the v0.3 bump.
  # A stale formula is the dangerous one: Homebrew derives `version` from the
  # tarball URL, so its own version assertion checks the stale number against a
  # stale tarball and passes, and `brew install` ships the old release with
  # nothing anywhere reporting a problem. Checked here, on the bump PR, rather
  # than at release time when the tag is already cut.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Version consistency across artifacts
        run: packaging/check-version-consistency.sh
      # build-deb.sh derives the version from roost.py, so this is really a
      # check that the derivation still works and the man page it gzips in is
      # the one we just validated. It prints the artifact path on success.
      - name: The .deb builds and carries the same version
        run: |
          set -euo pipefail
          packaging/build-deb.sh
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' roost.py)
          test -f "dist/roost_${version}_all.deb"
          # The man page ships inside the .deb; confirm the version reached it
          # rather than trusting that the file on disk was the one packaged.
          # (Extract rather than stream a named tar member -- dpkg emits the
          # './' prefix and matching it exactly is needlessly brittle.)
          rm -rf /tmp/debx && mkdir -p /tmp/debx
          dpkg-deb -x "dist/roost_${version}_all.deb" /tmp/debx
          got=$(gunzip -c /tmp/debx/usr/share/man/man1/roost.1.gz | head -1)
          case "$got" in
            *"\"roost ${version}\""*) ;;
            *) echo "::error::man page in the .deb says: $got (want roost ${version})"; exit 1 ;;
          esac
          echo "dist/roost_${version}_all.deb carries man page roost ${version}"

  security:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off .

  # The branch ruleset requires this one check instead of naming every job
  # above. Required checks match by name, and a matrix leg's name is its
  # parameters, so a matrix change silently strands the ruleset: this repo's
  # named twelve test legs for a matrix that had twenty-four, and leghorn's
  # kept demanding "test (macos-13, ...)" long after that leg was gone,
  # leaving every PR on "Expected -- waiting for status". This job's name
  # never changes; what it asserts is "every job in ci.yml succeeded".
  # codespell and the PR-title lint live in their own workflows, so the
  # ruleset still names those two directly.
  #
  # `if: always()` is load-bearing. Without it a failed dependency skips this
  # job, and a skipped required check shows as pending forever rather than
  # failed. The jq line then does the real gating: success only, so a
  # cancelled or skipped job fails the gate instead of slipping through as
  # merely not-a-failure.
  ci-ok:
    if: always()
    needs: [test, packaging, security]
    runs-on: ubuntu-latest
    steps:
      - name: Every job in ci.yml succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
