name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # roost claims 3.9+ and claims to run on Windows and macOS. Both claims are
    # load-bearing -- the Windows path uses ctypes for process liveness and
    # console VT, which no Linux run would ever exercise.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI
        run: |
          python roost.py --version
          python roost.py -1 --no-color

  # roost.py is the single source of the version, but the man page and the
  # Homebrew formula embed it as literal text and both drifted on the v0.3 bump.
  # A stale formula is the dangerous one: Homebrew derives `version` from the
  # tarball URL, so its own version assertion checks the stale number against a
  # stale tarball and passes, and `brew install` ships the old release with
  # nothing anywhere reporting a problem. Checked here, on the bump PR, rather
  # than at release time when the tag is already cut.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Version consistency across artifacts
        run: packaging/check-version-consistency.sh
      # build-deb.sh derives the version from roost.py, so this is really a
      # check that the derivation still works and the man page it gzips in is
      # the one we just validated. It prints the artifact path on success.
      - name: The .deb builds and carries the same version
        run: |
          set -euo pipefail
          packaging/build-deb.sh
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' roost.py)
          test -f "dist/roost_${version}_all.deb"
          # The man page ships inside the .deb; confirm the version reached it
          # rather than trusting that the file on disk was the one packaged.
          # (Extract rather than stream a named tar member -- dpkg emits the
          # './' prefix and matching it exactly is needlessly brittle.)
          rm -rf /tmp/debx && mkdir -p /tmp/debx
          dpkg-deb -x "dist/roost_${version}_all.deb" /tmp/debx
          got=$(gunzip -c /tmp/debx/usr/share/man/man1/roost.1.gz | head -1)
          case "$got" in
            *"\"roost ${version}\""*) ;;
            *) echo "::error::man page in the .deb says: $got (want roost ${version})"; exit 1 ;;
          esac
          echo "dist/roost_${version}_all.deb carries man page roost ${version}"

  security:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off .
